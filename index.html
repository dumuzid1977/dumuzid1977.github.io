<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pages</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--muted:#6b6a65;--line:#dcd8cf;--accent:#2f5d50}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--muted:#9a988f;--line:#2e2d2a;--accent:#8fc1b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 16px}
h1{font-size:28px;margin:0 0 4px}
p{color:var(--muted);margin:0 0 32px}
a.card{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;margin-bottom:12px}
a.card:hover{border-color:var(--accent)}
a.card strong{display:block;color:var(--accent)}
a.card span{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<h1>Pages</h1>
<p>Plans and pages to share with friends.</p>
<a class="card" href="trip/"><strong>Scotland 2027</strong><span>Edinburgh, then by train to Blair Atholl for a week of stalking, 11–22 August 2027</span></a>
</main>
</body>
</html>
